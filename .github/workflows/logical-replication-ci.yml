name: Logical replication CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - deployments/*.json
      - logical-replication/**
      - scripts/apply_logical_replication_transition.py
      - dags/dataflow_logical_replication_ci.py
      - .github/workflows/logical-replication-ci.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: logical-replication-ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  logical-replication-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    env:
      DEPLOYMENT_CONFIG: ${{ vars.DATAFLOW_CI_DEPLOYMENT_CONFIG || 'deployments/internal-workload-data-666.json' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve tagged release and environment
        id: release
        shell: bash
        run: |
          set -euo pipefail
          test -f "$DEPLOYMENT_CONFIG"
          deployment=$(basename "$DEPLOYMENT_CONFIG" .json)
          system=${deployment#internal-workload-}
          test "$system" != "$deployment"
          release=$(jq -er '.release' "$DEPLOYMENT_CONFIG")
          release_commit=$(git rev-parse --verify "refs/tags/${release}^{commit}")
          git cat-file -e "${release_commit}:exerp-dbt/dbt_project.yml"
          git cat-file -e "${release_commit}:logical-replication/tables.json"
          echo "deployment=$deployment" >> "$GITHUB_OUTPUT"
          echo "bucket=exerp-${system}-dataflow-airflow" >> "$GITHUB_OUTPUT"
          echo "mwaa=${system}-dataflow-airflow" >> "$GITHUB_OUTPUT"
          echo "region=$(jq -r '.aws_region' "$DEPLOYMENT_CONFIG")" >> "$GITHUB_OUTPUT"
          echo "role=$(jq -r '.aws_role_arn' "$DEPLOYMENT_CONFIG")" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "release_commit=$release_commit" >> "$GITHUB_OUTPUT"

      - name: Package logical replication from tagged release
        id: artifact
        shell: bash
        env:
          RELEASE: ${{ steps.release.outputs.release }}
          RELEASE_COMMIT: ${{ steps.release.outputs.release_commit }}
          PR_COMMIT: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/logical-replication-release"
          mkdir -p "$stage"
          git show "${RELEASE_COMMIT}:logical-replication/tables.json" \
            > "$stage/tables.json"
          cp scripts/apply_logical_replication_transition.py "$stage/"
          artifact="$RUNNER_TEMP/logical-replication-${RELEASE}.tar.gz"
          tar -C "$stage" --sort=name --mtime='@0' --owner=0 --group=0 \
            --numeric-owner -cf - tables.json \
            apply_logical_replication_transition.py \
            | gzip -n > "$artifact"
          checksum=$(sha256sum "$artifact" | cut -d' ' -f1)
          key="logical_replication/ci/pr-${PR_NUMBER}/${PR_COMMIT}/logical-replication-${RELEASE}.tar.gz"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.release.outputs.role }}
          aws-region: ${{ steps.release.outputs.region }}

      - name: Upload immutable tagged artifact
        env:
          BUCKET: ${{ steps.release.outputs.bucket }}
          KEY: ${{ steps.artifact.outputs.key }}
          ARTIFACT: ${{ steps.artifact.outputs.artifact }}
          CHECKSUM: ${{ steps.artifact.outputs.checksum }}
          RELEASE: ${{ steps.release.outputs.release }}
          RELEASE_COMMIT: ${{ steps.release.outputs.release_commit }}
        run: |
          set -euo pipefail
          if aws s3api put-object --bucket "$BUCKET" --key "$KEY" \
            --body "$ARTIFACT" \
            --metadata "release=$RELEASE,commit=$RELEASE_COMMIT,sha256=$CHECKSUM" \
            --if-none-match '*'; then
            exit 0
          fi
          metadata=$(aws s3api head-object --bucket "$BUCKET" --key "$KEY")
          test "$(jq -r '.Metadata.release' <<< "$metadata")" = "$RELEASE"
          test "$(jq -r '.Metadata.commit' <<< "$metadata")" = "$RELEASE_COMMIT"
          test "$(jq -r '.Metadata.sha256' <<< "$metadata")" = "$CHECKSUM"

      - name: Trigger MWAA logical-replication CI
        id: trigger
        shell: bash
        env:
          DEPLOYMENT: ${{ steps.release.outputs.deployment }}
          BUCKET: ${{ steps.release.outputs.bucket }}
          MWAA: ${{ steps.release.outputs.mwaa }}
          RELEASE: ${{ steps.release.outputs.release }}
          RELEASE_COMMIT: ${{ steps.release.outputs.release_commit }}
          KEY: ${{ steps.artifact.outputs.key }}
          CHECKSUM: ${{ steps.artifact.outputs.checksum }}
          PR_COMMIT: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          run_id="github_logical_pr_${PR_NUMBER}__${GITHUB_RUN_ID}__${GITHUB_RUN_ATTEMPT}"
          conf=$(jq -cn \
            --arg deployment "$DEPLOYMENT" --arg bucket "$BUCKET" \
            --arg release "$RELEASE" --arg release_commit "$RELEASE_COMMIT" \
            --arg pr_commit "$PR_COMMIT" --arg key "$KEY" \
            --arg checksum "$CHECKSUM" --argjson pr "$PR_NUMBER" \
            '{deployment:$deployment,bucket:$bucket,pr_number:$pr,
              pr_commit_sha:$pr_commit,release:$release,
              release_commit_sha:$release_commit,artifact_key:$key,
              artifact_sha256:$checksum}')
          body=$(jq -cn --arg run "$run_id" --argjson conf "$conf" \
            '{dag_run_id:$run,logical_date:null,conf:$conf}')
          response=$(aws mwaa invoke-rest-api --name "$MWAA" \
            --path '/dags/dataflow_logical_replication_ci/dagRuns' \
            --method POST --body "$body")
          test "$(jq -r '.RestApiStatusCode' <<< "$response")" = "200"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Wait for MWAA result
        shell: bash
        env:
          MWAA: ${{ steps.release.outputs.mwaa }}
          RUN_ID: ${{ steps.trigger.outputs.run_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 360); do
            response=$(aws mwaa invoke-rest-api --name "$MWAA" \
              --path "/dags/dataflow_logical_replication_ci/dagRuns/${RUN_ID}" \
              --method GET)
            test "$(jq -r '.RestApiStatusCode' <<< "$response")" = "200"
            state=$(jq -r \
              '.RestApiResponse | if type == "string" then fromjson else . end | .state' \
              <<< "$response")
            echo "MWAA run state: $state"
            case "$state" in
              success) exit 0 ;;
              failed) exit 1 ;;
            esac
            sleep 20
          done
          echo 'Timed out waiting for MWAA' >&2
          exit 1
