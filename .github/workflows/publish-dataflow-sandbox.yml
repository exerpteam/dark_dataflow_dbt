name: Publish Dataflow sandbox release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - deployments/sandbox.json

permissions:
  contents: read
  id-token: write

concurrency:
  group: dataflow-sandbox-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: internal-workload-data-666
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check AWS settings
        env:
          DEPLOY_ROLE: ${{ vars.AWS_ROLE_ARN }}
          DEPLOY_REGION: ${{ vars.AWS_REGION }}
        run: |
          test -n "$DEPLOY_ROLE" || { echo 'Set sandbox variable AWS_ROLE_ARN'; exit 1; }
          test -n "$DEPLOY_REGION" || { echo 'Set sandbox variable AWS_REGION'; exit 1; }

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Package tagged project and publish selection
        run: python scripts/publish_dataflow.py deployments/sandbox.json

      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-release-selection
          path: ${{ runner.temp }}/dataflow-publish/deployment.json
