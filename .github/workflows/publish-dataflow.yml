name: Publish Dataflow release

on:
  workflow_dispatch:
    inputs:
      deployment:
        description: Deployment environment name
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - deployments/*.json

permissions:
  actions: read
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.deployments.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select deployments
        id: deployments
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          REQUESTED_DEPLOYMENT: ${{ inputs.deployment }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            configs=("deployments/${REQUESTED_DEPLOYMENT}.json")
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            mapfile -t configs < <(git ls-tree -r --name-only "$CURRENT_SHA" -- 'deployments/*.json')
          else
            mapfile -t configs < <(git diff --name-only --diff-filter=ACMR "$BEFORE_SHA" "$CURRENT_SHA" -- 'deployments/*.json')
          fi
          ((${#configs[@]})) || { echo 'No deployment configurations selected'; exit 1; }
          matrix_output=$(python scripts/deployment_matrix.py "${configs[@]}")
          matrix=${matrix_output#matrix=}
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  publish:
    needs: discover
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    concurrency:
      group: dataflow-${{ matrix.deployment }}-publish
      cancel-in-progress: false
    env:
      DEPLOYMENT_NAME: ${{ matrix.deployment }}
      DEPLOYMENT_CONFIG: ${{ matrix.config }}
      RELEASE_BUCKET: ${{ matrix.bucket }}
      MWAA_ENVIRONMENT: ${{ matrix.mwaa_environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test deployment configuration
        run: python -m unittest discover -s tests -v

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ matrix.aws_role_arn }}
          aws-region: ${{ matrix.aws_region }}

      - name: Package tagged project and publish selection
        run: python scripts/publish_dataflow.py "$DEPLOYMENT_CONFIG"

      - name: Trigger MWAA release DAG
        shell: bash
        env:
          DAG_ID: dataflow_auto_release
        run: |
          dag_run_id="github__${GITHUB_RUN_ID}__${GITHUB_RUN_ATTEMPT}"
          body=$(jq -cn \
            --arg dag_run_id "$dag_run_id" \
            --arg bucket "$RELEASE_BUCKET" \
            --arg deployment "$DEPLOYMENT_NAME" \
            '{dag_run_id: $dag_run_id, logical_date: null, conf: {deployment: $deployment, bucket: $bucket, key: "dbt_project/deployment.json"}}')
          response=$(aws mwaa invoke-rest-api \
            --name "$MWAA_ENVIRONMENT" \
            --path "/dags/$DAG_ID/dagRuns" \
            --method POST \
            --body "$body")
          status=$(jq -r '.RestApiStatusCode' <<< "$response")
          test "$status" = "200" || {
            echo "MWAA rejected DAG trigger with HTTP status $status"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.deployment }}-release-selection
          path: ${{ runner.temp }}/dataflow-publish/deployment.json
